volumes:
  pgdata:
  coder-home:

services:
  postgres:
    image: postgres:17
    container_name: coder-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  coder:
    image: ghcr.io/coder/coder:${CODER_VERSION}
    container_name: coder-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Backend store
      CODER_PG_CONNECTION_URL: ${CODER_PG_CONNECTION_URL}

      # Server host/port
      CODER_HTTP_ADDRESS: 0.0.0.0:${CODER_PORT}

      # Workspace 에서 도달 가능한 주소여야 한다. (localhost/127.0.0.1 사용 불가)
      CODER_ACCESS_URL: ${CODER_ACCESS_URL}
      CODER_WILDCARD_ACCESS_URL: ${CODER_WILDCARD_ACCESS_URL}

      CODER_TELEMETRY_ENABLE: ${CODER_TELEMETRY_ENABLE}
    # Docker 템플릿을 사용하려면 호스트의 docker 그룹 권한이 필요하다.
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # dev tunnel URL(https://*.try.coder.app) 을 초기화하려면 이 볼륨을 제거하면 된다.
      - coder-home:/home/coder
    ports:
      - "${CODER_PORT}:${CODER_PORT}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${CODER_PORT}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  default:
    name: coder-network
